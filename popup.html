<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 16px; font: 13px/1.4 system-ui, sans-serif; background: #1b1b1d; color: #eee; }
  h1 { font-size: 14px; margin: 0 0 12px; color: #aaa; font-weight: 600; letter-spacing: .02em; }

  #toggle {
    width: 100%; padding: 14px 12px; border: 0; border-radius: 10px; cursor: pointer;
    font: 600 15px/1.2 system-ui, sans-serif; color: #fff; background: #2e7d32;
    transition: background .15s, transform .05s;
  }
  #toggle:hover { filter: brightness(1.1); }
  #toggle:active { transform: scale(.98); }
  #toggle.showing { background: #444; }
  #toggle small { display: block; margin-top: 4px; font-weight: 400; font-size: 12px; opacity: .8; }

  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin: 16px 0 6px; font-weight: 600; }
  label { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; }
  input { accent-color: #2e7d32; margin: 0; }
  #cats.off { opacity: .4; pointer-events: none; }
  p { margin: 12px 0 0; color: #777; font-size: 12px; }
  kbd { background: #2c2c2e; border-radius: 4px; padding: 1px 5px; font: 11px system-ui, sans-serif; color: #bbb; }
</style>
</head>
<body>
  <h1>Don't Influence Me</h1>
  <button id="toggle"></button>
  <h2>What to hide</h2>
  <div id="cats"></div>
  <p><kbd>Alt</kbd>+<kbd>Shift</kbd>+<kbd>D</kbd> also toggles.</p>
  <script src="settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
